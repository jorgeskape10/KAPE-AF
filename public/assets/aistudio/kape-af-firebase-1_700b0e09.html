<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="theme-color" content="#142433"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAPE A.F. · Asociación de Fútbol</title>
<style>
:root{--bg:#fff;--fg:#1a1d21;--mut:#5f6670;--card:#f3f5f7;--ac:#0b7a43;--bad:#c0392b;--bd:#d9dde2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--fg:#e8eaed;--mut:#9aa1ab;--card:#1f2327;--ac:#3fbf7f;--bad:#ff7b6b;--bd:#343a40}}
:root[data-theme="dark"]{--bg:#14171a;--fg:#e8eaed;--mut:#9aa1ab;--card:#1f2327;--ac:#3fbf7f;--bad:#ff7b6b;--bd:#343a40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:14px 16px 6px}h1{font-size:19px;margin:0}header p{margin:2px 0 0;color:var(--mut);font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:7px 12px;border-radius:18px;font:inherit;font-size:13px}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:14px 16px 40px;max-width:880px;margin:auto}
h2{font-size:17px;margin:4px 0 10px}h3{font-size:15px;margin:16px 0 6px}
.card{background:var(--card);border-radius:10px;padding:12px;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0}
.tag{font-size:12px;border:1px solid var(--bd);border-radius:10px;padding:1px 8px;color:var(--mut)}
.ok{color:var(--ac)}.bad{color:var(--bad)}.mut{color:var(--mut)}
select,input,button{font:inherit;padding:7px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);max-width:100%}
input[type=checkbox]{padding:0}button.a{background:var(--ac);color:#fff;border-color:var(--ac)}button.x{background:none;color:var(--bad);border-color:var(--bd);padding:3px 8px;font-size:12px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
pre{background:var(--card);padding:12px;border-radius:10px;overflow-x:auto;font-size:12px;line-height:1.45}
li{margin:3px 0}details{margin-top:6px}summary{cursor:pointer;color:var(--ac)}
#tz{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin:8px 16px;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--ac)}
.pitch{background:#2e7d32;border-radius:10px;padding:12px 4px;display:flex;flex-direction:column;gap:14px;margin:8px 0}.pr{display:flex;justify-content:space-around}
.sl{width:58px;height:58px;border-radius:50%;border:2px dashed #fff;background:rgba(255,255,255,.15);color:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1.1}
.sl small{font-size:10px;font-weight:400;max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sl.fil{background:#fff;color:#1a1d21;border-style:solid}.sl.sel{box-shadow:0 0 0 3px #ffd54f}

header{margin:10px 12px 0;border-radius:16px;background:linear-gradient(135deg,#0b3d2e,#0b7a43);color:#fff;padding:16px}
.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:13px;background:#fff;color:#0b7a43;font-weight:800;font-size:28px;display:flex;align-items:center;justify-content:center}
header h1{color:#fff;font-size:22px;letter-spacing:1px;line-height:1.1}.sub{color:#cfe9dc;font-size:13px;letter-spacing:.5px}header p{color:#cfe9dc;margin:10px 0 0;font-size:12px}
nav{border-bottom:0;padding:10px 12px}nav button{border-radius:20px;padding:8px 14px}
h2{font-size:19px;margin:10px 0 12px}h2::after{content:"";display:block;width:36px;height:3px;border-radius:2px;background:var(--ac);margin-top:5px}
.card{border:1px solid var(--bd);box-shadow:0 1px 2px rgba(0,0,0,.05);border-radius:14px}
button.a{font-weight:600}input,select{min-height:36px}
ol{padding-left:20px;margin:8px 0}
.chip{padding:5px 9px;border-radius:16px;font-size:13px}.chip.t{background:var(--ac);color:#fff;border-color:var(--ac)}.chip.b{border-color:#f0a500;background:rgba(240,165,0,.18)}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);scrollbar-width:none}nav::-webkit-scrollbar{display:none}
button{cursor:pointer;transition:transform .08s,opacity .15s}button:active{transform:scale(.97)}button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.chip{cursor:pointer;background:var(--card)}.tag.bad{color:var(--bad);border-color:var(--bad)}
.row[style*="align-items:stretch"]{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.row[style*="align-items:stretch"] .card{margin:0;text-align:center;min-width:0!important}.row[style*="align-items:stretch"] .card b{font-size:21px;color:var(--ac)}
nav{display:flex;gap:4px;overflow-x:auto}nav button{flex:1;white-space:nowrap;padding-inline:8px}
.sn{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:4px;scrollbar-width:none}.sn button{border-radius:999px;font-size:13px;padding:6px 13px;white-space:nowrap;background:var(--card)}.sn button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#tz{box-shadow:0 4px 14px rgba(0,0,0,.2)}main{min-height:50vh}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

:root{--bg:#eef3f2;--fg:#142433;--mut:#5b6b75;--card:#fff;--ac:#0e8a5f;--on:#fff;--bad:#c0392b;--bd:#d5e0dd;--mint:#6fe3ae;--navy:#142433}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a23;--fg:#e8f1ee;--mut:#93a8b3;--card:#16262f;--ac:#6fe3ae;--on:#0b1a24;--bad:#ff8a7a;--bd:#263b48}}
:root[data-theme="dark"]{--bg:#0e1a23;--fg:#e8f1ee;--mut:#93a8b3;--card:#16262f;--ac:#6fe3ae;--on:#0b1a24;--bad:#ff8a7a;--bd:#263b48}
body{background:var(--bg)}
header{background:var(--card)!important;color:var(--fg)!important;border:1px solid var(--bd);border-bottom:4px solid var(--ac);box-shadow:0 6px 18px rgba(20,36,51,.10);padding:14px 16px!important}
.brand{gap:14px}.lg{height:64px;width:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg{filter:drop-shadow(0 0 3px rgba(255,255,255,.55))}}
header h1{color:var(--fg)!important;font-size:24px!important;letter-spacing:2px}header .sub{color:var(--ac)!important;font-weight:600;letter-spacing:1px;text-transform:uppercase;font-size:11px}header p{color:var(--mut)!important}
button.a,nav button.on,.sn button.on,.chip.t{background:var(--ac)!important;color:var(--on)!important;border-color:var(--ac)!important}
nav button,.sn button{background:var(--card)}
h2::after{background:linear-gradient(90deg,var(--ac),transparent);width:56px}
.card{background:var(--card);border-color:var(--bd);box-shadow:0 2px 8px rgba(20,36,51,.06)}
.row[style*="align-items:stretch"] .card b{color:var(--ac)}
summary{color:var(--ac)}
.row[style*="align-items:stretch"] .card b{font-size:inherit;color:inherit}.kv b{font-size:21px!important;color:var(--ac)!important}
nav{gap:3px;padding-inline:8px}nav button{padding:8px 5px!important;font-size:12.5px;min-width:0}

function validarArbitro(refId,m){
  const r=by(D.referees,refId);
  if(!r)return{ok:false,msg:"Árbitro no encontrado."};
  if(!r.ok)return{ok:false,msg:"El árbitro aún no está aprobado por el administrador."};
  if(r.playerId){
    const j=by(D.players,r.playerId);
    if(j&&(j.team==m.a||j.team==m.b))
      return{ok:false,msg:"Conflicto de intereses: "+r.name+" es jugador de "+tn(j.team)+"."};
  }
  const choque=D.matches.find(x=>x.id!=m.id&&m.date&&x.ref==r.id&&x.date==m.date&&x.time==m.time);
  if(choque)return{ok:false,msg:"Ya tiene otra designación en ese horario."};
  return{ok:true,msg:"Designación válida."};
}
function validarTraspaso(pid,destino,fecha){
  const d=new Date(fecha+"T00:00:00"),DAY=864e5;
  const lun=new Date(d-((d.getDay()+6)%7)*DAY),dom=new Date(+lun+6*DAY);
  const AP=F().flatMap(m=>(m.part||[]).map(x=>({p:x.p,team:x.t,date:m.date})));
  const jugo=AP.find(a=>a.p==pid&&a.team!=destino&&new Date(a.date+"T00:00:00")>=lun&&new Date(a.date+"T00:00:00")<=dom);
  if(jugo)return{ok:false,msg:"Restricción semanal: ya jugó con otro equipo el "+jugo.date+" (semana lunes a domingo)."};
  const n=D.transfers.filter(t=>t.p==pid&&(d-new Date(t.date+"T00:00:00"))/DAY<=30&&d>=new Date(t.date+"T00:00:00")).length;
  if(n>=2)return{ok:false,msg:"Restricción mensual: ya hizo "+n+" cambios en los últimos 30 días."};
  return{ok:true,msg:"Traspaso permitido."};
}
function ranking(){
  const calc=(bono,orden)=>{const pts={};D.teams.forEach(t=>pts[t.id]=0);
    F().filter(m=>!m.torneo).forEach(f=>[[f.a,f.b,f.ga,f.gb,f.ya,f.ra,(f.pen||{}).a],[f.b,f.a,f.gb,f.ga,f.yb,f.rb,(f.pen||{}).b]].forEach(([x,y,gf,gc,am,ro,pn])=>{
      if(!(x in pts))return;let base=gf>gc?3:gf==gc?1:0;
      if(bono&&gf>gc){const pos=orden.indexOf(y);base*=pos==0?1.75:pos<3?1.5:1}
      pts[x]+=base+0.2*gf-0.1*gc-0.5*am-2*ro-PEN(pn)}));D.torneos.forEach(t=>Object.entries(t.premios||{}).forEach(([id,v])=>{if(id in pts)pts[id]+=v}));return pts};
  const p0=calc(false),ord=Object.keys(p0).sort((a,b)=>p0[b]-p0[a]),p1=calc(true,ord);
  return Object.keys(p1).sort((a,b)=>p1[b]-p1[a]).map(id=>({id,pts:p1[id]}));
}

reglas(){return`<h2>Reglamento general de KAPE A.F.</h2>
<h3>Cap. I · Inscripción y equipos</h3><ul><li>Art. 1. Los equipos se registran y gestionan su información (nombre, escudo, colores, cancha sede, contacto). Nada es oficial hasta que el administrador lo apruebe.</li><li>Art. 2. Plantel de hasta 25 jugadores base más 5 opcionales (máximo 30), con nombre, cédula, dorsal (único dentro del equipo), posición principal, hasta tres posiciones secundarias y foto. La cédula es única en la asociación: el sistema detecta y rechaza el registro de una misma persona dos veces.</li></ul>
<h3>Cap. II · Traspasos y fair play</h3><ul><li>Art. 3. Traspasos libres en periodos permitidos, sujetos a aprobación del administrador.</li><li>Un jugador no puede jugar con dos equipos distintos en la misma semana (lunes a domingo).</li><li>Un jugador no puede cambiar de equipo más de 2 veces en 30 días.</li></ul>

<h3>Cap. V · Estadísticas individuales</h3><ul><li>Art. 8. Tablas de goleadores, asistentes y MVP, en tiempo real e históricas.</li></ul>

<h3>Cap. VII · Canchas y modalidades</h3><ul><li>Art. 13. Cada cancha tiene perfil (dirección, superficie, iluminación, modalidades habilitadas) aprobado por el administrador.</li><li>Art. 14. Modalidades: Fútbol 5, Fútbol 7 y Fútbol 11. Cada equipo se inscribe en una modalidad, solo enfrenta equipos de la misma y en canchas habilitadas para ella. Duración, cambios y tamaño de plantel los fija KAPE A.F. en cada torneo.</li><li>Art. 15. Categorías: cada equipo se inscribe como masculino, femenino o mixto. Los equipos mixtos pueden alinear jugadores y jugadoras, y solo enfrentan equipos de su misma categoría.</li></ul>`},

const CRIT={
 uefa:{n:"UEFA Champions League",d:["pts","h2h","dg","gf","gv","fp","rnd"]},
 premier:{n:"Premier League",d:["pts","dg","gf","h2h","fp","rnd"]},
 laliga:{n:"LaLiga",d:["pts","h2h","dg","gf","fp","rnd"]},
 seriea:{n:"Serie A",d:["pts","h2h","dg","gf","rnd"]},
 bundes:{n:"Bundesliga",d:["pts","dg","gf","h2h","rnd"]},
 ligue1:{n:"Ligue 1",d:["pts","dg","gf","h2h","fp","rnd"]},
 conmebol:{n:"CONMEBOL Libertadores",d:["pts","w","dg","gf","fp","rnd"]},

const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const LET="ABCDEFGH";
function stat(ms,teams){const s={};teams.forEach(t=>s[t]={t,pj:0,w:0,e:0,l:0,gf:0,gc:0,pts:0,gv:0,fp:0});
  ms.forEach(m=>{if(!m.played||!s[m.a]||!s[m.b])return;const A=s[m.a],B=s[m.b];A.pj++;B.pj++;A.gf+=m.ga;A.gc+=m.gb;B.gf+=m.gb;B.gc+=m.ga;B.gv+=m.gb;
    if(m.ga>m.gb){A.w++;A.pts+=3;B.l++}else if(m.ga<m.gb){B.w++;B.pts+=3;A.l++}else{A.e++;B.e++;A.pts++;B.pts++}
    A.fp+=(m.ya||0)+3*(m.ra||0);B.fp+=(m.yb||0)+3*(m.rb||0)});
  Object.values(s).forEach(x=>x.dg=x.gf-x.gc);return s}
function rank(teams,ms,crit){const all=stat(ms,teams);
  const val=(c,x)=>c=="fp"?-x.fp:c=="rnd"?[...x.t].reduce((h,ch)=>(h*31+ch.charCodeAt(0))|0,7):x[c];
  const go2=(cl,cs)=>{if(cl.length<2||!cs.length)return cl;const [c,...rest]=cs;let k;
    if(c=="h2h"){const h=stat(ms.filter(m=>cl.includes(m.a)&&cl.includes(m.b)),cl);k=cl.map(t=>({t,k:[h[t].pts,h[t].dg,h[t].gf]}))}
    else k=cl.map(t=>({t,k:[val(c,all[t])]}));
    k.sort((a,b)=>{for(let i=0;i<a.k.length;i++)if(a.k[i]!=b.k[i])return b.k[i]-a.k[i];return 0});
    const out=[];let g=[k[0]];for(let i=1;i<k.length;i++){if(k[i].k.join()==g[0].k.join())g.push(k[i]);else{out.push(g);g=[k[i]]}}out.push(g);
    return out.flatMap(g=>go2(g.map(x=>x.t),rest))};
  return go2(teams,crit).map(t=>all[t])}
function rr(ts,legs){const a=[...ts];if(a.length%2)a.push(null);const n=a.length,R=[];
  for(let r=0;r<n-1;r++){const p=[];for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x&&y)p.push(r%2?[y,x]:[x,y])}R.push(p);a.splice(1,0,a.pop())}
  return legs==2?[...R,...R.map(p=>p.map(([x,y])=>[y,x]))]:R}
const fx=(t,fase,rounds,grupo)=>rounds.flatMap((p,i)=>p.map(([a,b])=>({torneo:t.id,fase,grupo:grupo||"",ronda:0,leg:0,jornada:i+1,mod:t.mod,a,b,date:"",time:"",venue:"",ref:"",played:false})));
function createKO(t,L,r,cons){const n=L.length,P=2**Math.ceil(Math.log2(n)),bye=L.slice(0,P-n),pl=L.slice(P-n),pr=[];
  for(let i=0;i<pl.length/2;i++)pr.push(cons?[pl[2*i],pl[2*i+1]]:[pl[i],pl[pl.length-1-i]]);
  const lg=t.idaKO&&!(pr.length==1&&!bye.length)?2:1,docs=[];
  pr.forEach(([a,b])=>{for(let l=1;l<=lg;l++)docs.push({torneo:t.id,fase:"ko",ronda:r,leg:lg==2?l:0,grupo:"",jornada:0,mod:t.mod,a:l==1?a:b,b:l==1?b:a,date:"",time:"",venue:"",ref:"",played:false})});
  return{docs,bye}}
function plan(c){const N=c.teams.length,l=c.ida?2:1,lk=c.idaKO?2:1,g=c.G?Math.ceil(N/c.G):0,L2=x=>Math.ceil(Math.log2(Math.max(2,x))),f=c.idaKO?1:0;
  const M=c.fmt=="liga"?(N-1)*l:c.fmt=="copa"?L2(N)*lk-f:c.fmt=="gl"?(g-1)*l+(c.G*c.qual-1)*l:c.fmt=="gc"?(g-1)*l+L2(c.G*c.qual)*lk-f:c.k+L2(c.Q)*lk-f;
  const champ=Math.max(10,Math.round(8*Math.log2(Math.max(2,N))*(1+M/10)));
  return{N,M,champ,sub:Math.round(champ*.6),semi:Math.round(champ*.4),part:Math.max(2,Math.round(champ*.1))}}
function ganadores(t,r){const ms=D.matches.filter(m=>m.torneo==t.id&&m.fase=="ko"&&m.ronda==r),ties={},W=[];
  ms.forEach(m=>{const k=[m.a,m.b].sort().join("|");(ties[k]=ties[k]||[]).push(m)});
  for(const k in ties){const [x,y]=k.split("|");let gx=0,gy=0,pk=null;
    ties[k].forEach(m=>{const ax=m.a==x;gx+=ax?m.ga:m.gb;gy+=ax?m.gb:m.ga;if(m.pk)pk={x:ax?m.pk.a:m.pk.b,y:ax?m.pk.b:m.pk.a}});
    if(gx>gy)W.push(x);else if(gy>gx)W.push(y);else if(pk&&pk.x!=pk.y)W.push(pk.x>pk.y?x:y);else return{err:"Empate global entre "+tn(x)+" y "+tn(y)+": registra penales en el acta."}}
  return{W}}
const addM=l=>Promise.all(l.map(d=>w(col("matches").add(d))));
const upT=(id,d)=>w(col("torneos").doc(id).update(d));
async function koStart(t,L){const k=createKO(t,L,1,false);await addM(k.docs);return upT(t.id,{fase:"ko",ronda:1,byes:{1:k.bye}})}
async function avanzar(id){const t=by(D.torneos,id),ms=D.matches.filter(m=>m.torneo==id),cur=ms.filter(m=>m.fase==t.fase&&(t.fase!="ko"||m.ronda==t.ronda)),crit=CRIT[t.crit].d;
  if(!cur.length)return alert("Aún no hay partidos en esta fase.");
  if(cur.some(m=>!m.played))return alert("Faltan partidos por jugar en esta fase.");
  if(t.fase=="grupos"){const q=Object.entries(t.grupos).map(([g,ts])=>rank(ts,cur.filter(m=>m.grupo==g),crit).map(x=>x.t).slice(0,t.qual)),L=[];
    for(let p=0;p<t.qual;p++)q.forEach(r=>r[p]&&L.push(r[p]));
    if(t.fmt=="gl"){if(t.emode!="manual")await addM(fx(t,"liguilla",rr(L,t.ida?2:1)));return upT(id,{fase:"liguilla",clasif:L})}
    return koStart(t,L)}
  if(t.fase=="liga"&&t.fmt=="ch")return koStart(t,rank(t.teams,cur,crit).map(x=>x.t).slice(0,t.Q));
  if(t.fase=="ko"){const g=ganadores(t,t.ronda);if(g.err)return alert(g.err);
    const L=[...g.W,...((t.byes||{})[t.ronda]||[])];if(L.length==1)return finalizar(id,L[0]);
    const k=createKO(t,L,t.ronda+1,true);await addM(k.docs);return upT(id,{ronda:t.ronda+1,byes:{...(t.byes||{}),[t.ronda+1]:k.bye}})}
  return finalizar(id)}
async function finalizar(id,champ){const t=by(D.torneos,id),ms=D.matches.filter(m=>m.torneo==id),crit=CRIT[t.crit].d,P=t.pts,prem={};
  t.teams.forEach(x=>{prem[x]=P.part});
  const lg=(ts,mm)=>{const r=rank(ts,mm,crit);r.forEach((x,i)=>{prem[x.t]=Math.round(P.champ*(i==0?1:Math.max(.1,.6*(r.length-1-i)/Math.max(1,r.length-2))))});return r[0].t};
  if(t.fmt=="liga")champ=lg(t.teams,ms.filter(m=>m.fase=="liga"));
  else if(t.fmt=="gl")champ=lg(t.clasif,ms.filter(m=>m.fase=="liguilla"));
  else{const R=t.ronda,last={};ms.filter(m=>m.fase=="ko").forEach(m=>{[m.a,m.b].forEach(x=>{last[x]=Math.max(last[x]||0,m.ronda)})});
    Object.entries(last).forEach(([x,r])=>{const d=R-r,f=d==0?.6:d==1?.4:d==2?.25:.15;prem[x]=Math.max(prem[x],Math.round(P.champ*f))});
    prem[champ]=P.champ}
  await upT(id,{estado:"finalizado",premios:prem,campeon:champ});alert("Torneo finalizado. Campeón: "+tn(champ)+". Los puntos ya suman al ranking.")}
function progMatch(id){w(col("matches").doc(id).update({date:val("d"+id),time:val("h"+id),venue:val("c"+id)}))}
function addTM(tid){const t=by(D.torneos,tid),a=val("tma"),b=val("tmb");if(a==b)return alert("Elige dos equipos distintos.");
  const gr=t.fase=="grupos"?val("tmg"):"";if(gr&&!(t.grupos[gr]||[]).includes(a))return alert("Ambos equipos deben ser del grupo "+gr+".");

function pst(id){const p=by(D.players,id)||{},S={pj:0,g:0,gp:0,gl:0,s:0,y:0,r:0,m:0,pa:0,pf:0,og:0,ht:0,gr:0,pc:0,tg:0,tp:0};
  F().forEach(m=>{const x=(m.part||[]).find(r=>r.p==id);if(x){S.pj++;["g","gp","gl","s","y","r","pa","pf","og"].forEach(k=>S[k]+=x[k]||0);if((x.g||0)>=3)S.ht++;
    if(p.pos=="POR"){const a=x.t==m.a,gc=a?m.gb:m.ga;S.gr+=gc;if(!gc)S.pc++;if(m.pk){(a?m.pk.a>m.pk.b:m.pk.b>m.pk.a)?S.tg++:S.tp++}}}
    if(m.mvp==id)S.m++});
  Object.entries(p.adj||{}).forEach(([k,v])=>S[k]=(S[k]||0)+(+v||0));S.gj=S.g-S.gp-S.gl;return S}

crearTorneo=async function(f){if(f===true||AS.r!="capitan")return _ct();const c=TC,mt=myTeam(),N=c.teams.length;
  if(!c.name.trim())return alert("Ponle nombre al torneo.");if(!c.teams.includes(mt))return alert("Tu equipo debe participar.");if(N<MIN[c.fmt])return alert("Invita al menos a "+MIN[c.fmt]+" equipos para este formato.");
  const resp={};c.teams.forEach(t=>resp[t]=t==mt?true:null);await w(col("propuestas").add({cfg:c,by:mt,resp,st:"abierta"}));TC=null;go("torneos");alert("Invitaciones enviadas.")};
async function responder(id,ok){const x=by(D.propuestas,id),resp={...x.resp,[myTeam()]:ok};await w(col("propuestas").doc(id).update({resp}));
  if(Object.values(resp).some(v=>v===null))return alert("Respuesta enviada.");
  const acc=Object.keys(resp).filter(k=>resp[k]);
  if(acc.length<MIN[x.cfg.fmt]){await w(col("propuestas").doc(id).update({st:"cancelada"}));return alert("Torneo cancelado: no se alcanzó el mínimo de equipos.")}
  const c={...x.cfg,teams:acc};if(acc.length<x.cfg.teams.length){c.gmode="azar";c.emode="azar"}
  await w(col("propuestas").doc(id).update({st:"creada"}));TC=c;await _ct()}

/* Cédulas privadas: en Firebase solo se guarda su huella (hash) para evitar duplicados; el texto solo lo lee el admin */
const cedOf=p=>(CED.find(x=>x.p==p.id)||{}).c||p.cedula||"";
async function cedHash(c){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(c));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function cedDup(c,ex){if(!FB)return D.players.find(p=>p.id!=ex&&ced(p.cedula)==c);const d=await db.collection("cedulas").doc(await cedHash(c)).get();return d.exists&&d.data().p!=ex?(by(D.players,d.data().p)||{name:"otro jugador",team:""}):null}
async function saveCed(pid,c,wasEdit){const h=await cedHash(c);if(wasEdit){const o=CED.find(x=>x.p==pid);if(o&&o.id!=h)await db.collection("cedulas").doc(o.id).delete().catch(()=>{})}await db.collection("cedulas").doc(h).set({p:pid,c})}

/* Exportar: calendario (.ics), ranking como imagen, respaldo */
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function exportICS(){const f=x=>x.getFullYear()+String(x.getMonth()+1).padStart(2,"0")+String(x.getDate()).padStart(2,"0")+"T"+String(x.getHours()).padStart(2,"0")+String(x.getMinutes()).padStart(2,"0")+"00",q=s=>String(s).replace(/[,;\n]/g," "),L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//KAPE AF//ES"];
 D.matches.filter(m=>!m.played&&m.date).forEach(m=>{const d=new Date(m.date+"T"+(m.time||"16:00")+":00");if(isNaN(d))return;L.push("BEGIN:VEVENT","UID:"+m.id+"@kape-af","DTSTAMP:"+f(new Date()),"DTSTART:"+f(d),"DTEND:"+f(new Date(d.getTime()+36e5)),"SUMMARY:"+q(tn(m.a)+" vs "+tn(m.b)),"LOCATION:"+q((by(D.venues,m.venue)||{}).name||""),"END:VEVENT")});
 if(L.length<4)return alert("No hay partidos programados con fecha.");L.push("END:VCALENDAR");dl("kape-af-calendario.ics",L.join("\r\n"),"text/calendar")}
function exportTabla(){const rk=ranking();if(!rk.length)return alert("Aún no hay ranking.");const W=720,H=156+rk.length*44,c=document.createElement("canvas");c.width=W;c.height=H;
 const draw=im=>{const x=c.getContext("2d");x.fillStyle="#142433";x.fillRect(0,0,W,H);x.fillStyle="#6fe3ae";x.fillRect(0,0,W,6);
  if(im&&im.width){const h=96,w=im.width*h/im.height;x.fillStyle="#fff";x.beginPath();x.arc(W-28-w/2,22+h/2,h/2+8,0,7);x.fill();x.drawImage(im,W-28-w,22,w,h)}
  x.textAlign="left";x.fillStyle="#fff";x.font="bold 32px sans-serif";x.fillText("Ranking",28,64);x.font="14px sans-serif";x.fillStyle="#9fe6be";x.fillText("KAPE A.F. · "+new Date().toLocaleDateString("es"),28,92);
  rk.forEach((r,i)=>{const y=162+i*44;x.fillStyle=i%2?"rgba(255,255,255,.05)":"rgba(255,255,255,.11)";x.fillRect(20,y-27,W-40,40);x.font="bold 20px sans-serif";x.textAlign="left";x.fillStyle=i<3?"#6fe3ae":"#fff";x.fillText(String(i+1),36,y);x.fillStyle="#fff";x.fillText(tn(r.id).slice(0,28),84,y);x.textAlign="right";x.fillText(r.pts.toFixed(1)+" pts",W-36,y)});
  c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="kape-af-ranking.png";a.click()})};
 const im=new Image();im.onload=()=>draw(im);im.onerror=()=>draw(null);im.src=LOGO}

async function importBackup(i){const f=i.files[0];if(!f||!confirm("Restaurar sobrescribe los documentos con el mismo id. ¿Continuar?"))return;try{const o=JSON.parse(await f.text());let n=0;for(const k of Object.keys(D).concat("cedulas"))for(const d of o[k]||[]){const{id,...r}=d;await db.collection(k).doc(id).set(r);n++}alert("Respaldo restaurado: "+n+" documentos.")}catch(e){alert("Archivo inválido o sin permiso: "+e.message)}}
